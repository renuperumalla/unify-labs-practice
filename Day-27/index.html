<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop API</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1>🛒 Shop Product Manager</h1>

    <!-- Add Product Form -->
    <div class="card">
      <h2>Add Product</h2>
      <input type="text" id="name" placeholder="Product Name" />
      <input type="number" id="price" placeholder="Price" />
      <input type="number" id="stock" placeholder="Stock" />
      <button onclick="addProduct()">Add Product</button>
    </div>

    <!-- Product List -->
    <div class="card">
      <h2>Product List</h2>
      <button onclick="fetchProducts()">Refresh</button>
      <ul id="productList"></ul>
    </div>
  </div>

<script>
const API_URL = "/products";

// Fetch Products
async function fetchProducts() {
  const res = await fetch(API_URL);
  const products = await res.json();

  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach(product => {
    const li = document.createElement("li");
    li.innerHTML = `
      <strong>${product.name}</strong>
      - $${product.price}
      - Stock: ${product.stock}
      <br/>
      <input type="number" placeholder="New Stock" id="stock-${product._id}">
      <button onclick="updateStock('${product._id}')">Update</button>
      <button class="delete" onclick="deleteProduct('${product._id}')">Delete</button>
      <hr/>
    `;
    list.appendChild(li);
  });
}

// Add Product
async function addProduct() {
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const stock = document.getElementById("stock").value;

  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, price, stock })
  });

  fetchProducts();
}

// Update Stock
async function updateStock(id) {
  const newStock = document.getElementById(`stock-${id}`).value;

  await fetch(`${API_URL}/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stock: newStock })
  });

  fetchProducts();
}

// Delete Product
async function deleteProduct(id) {
  await fetch(`${API_URL}/${id}`, {
    method: "DELETE"
  });

  fetchProducts();
}

// Load on start
fetchProducts();
</script>

</body>
</html>
