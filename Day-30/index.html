<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TITAN Marketplace</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

<h1 class="logo">TITAN</h1>

<div class="header-actions">

<input type="text" id="searchInput" placeholder="Search products...">

<button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>

</div>

</header>

<section class="filters">

<select id="categoryFilter">

<option value="all">All Categories</option>
<option value="electronics">Electronics</option>
<option value="fashion">Fashion</option>
<option value="books">Books</option>

</select>

</section>

<main class="container">

<section id="productGrid" class="product-grid">

<!-- Product Card Example -->

<article class="product-card">

<img src="https://via.placeholder.com/200" alt="product">

<h3>Smart Watch</h3>

<p class="price">$99</p>

<button class="addCart">Add to Cart</button>

</article>

</section>

</main>

<!-- CART SIDEBAR -->

<div id="cartSidebar" class="cart-sidebar">

<h2>Your Cart</h2>

<ul id="cartItems"></ul>

<p class="total">Total: $<span id="cartTotal">0</span></p>

<button id="checkoutBtn">Checkout</button>

<button id="closeCart">Close</button>

</div>

<!-- CHECKOUT FORM -->

<div id="checkoutModal" class="modal">

<div class="modal-content">

<h2>Checkout</h2>

<form id="checkoutForm">

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<textarea placeholder="Shipping Address" required></textarea>

<button type="submit">Place Order</button>

</form>

<button id="closeCheckout">Cancel</button>

</div>

</div>

<footer>

<p>© 2026 TITAN Digital Marketplace</p>

</footer>

<script src="script.js"></script>

</body>

</html>
